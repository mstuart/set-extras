name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
    # eslint-plugin-unicorn (pulled in via the xo devDependency) declares
    # engines.node >=22 and crashes on startup under Node 20 (it uses
    # Iterator Helper methods that runtime doesn't have at all) — a dev
    # toolchain limitation, not a problem with this package's shipped code
    # (package.json engines still promises Node >=20 to consumers). Test
    # only on Node versions the dev tooling itself actually supports;
    # continue-on-error still left the Node 20 leg's check run reporting
    # failure, which blocked merges.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
