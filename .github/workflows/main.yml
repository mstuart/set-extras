name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
          - 20
    # eslint-plugin-unicorn (pulled in via the xo devDependency) requires
    # Node >=22 (it uses Iterator Helper methods absent from Node 20's
    # runtime), so `npm test` cannot run at all on Node 20 until xo drops
    # support for it or we do. Keep the leg for visibility without blocking
    # merges on a toolchain limitation unrelated to this package's own code.
    continue-on-error: ${{ matrix.node-version == 20 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
